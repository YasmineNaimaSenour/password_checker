<!-- Password Strength Panel Template -->
<div class="password-strength-panel">
  <div class="strength-meter">
    <div class="strength-progress"></div>
    <span class="strength-text"></span>
  </div>
  <ul class="rules-list">
    <li id="ruleLength"><span class="icon">❌</span><span class="text">At least 8 characters</span></li>
    <li id="ruleUppercase"><span class="icon">❌</span><span class="text">Contains uppercase letter</span></li>
    <li id="ruleLowercase"><span class="icon">❌</span><span class="text">Contains lowercase letter</span></li>
    <li id="ruleNumber"><span class="icon">❌</span><span class="text">Contains number</span></li>
    <li id="ruleSpecial"><span class="icon">❌</span><span class="text">Contains special character</span></li>
    <li id="ruleDictionary"><span class="icon">❌</span><span class="text">Not a common password</span></li>
  </ul>
  <div class="cracking-time">Estimated cracking time: -</div>
</div>
